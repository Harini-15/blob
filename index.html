<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <header>
            <ul>
                <li><a href="Google Image Search.html">Images</a></li>
                <li><a href="Google Advanced Search.html">Advanced Search</a></li>
                <li><a href="#"><img src="bars.png" id="bars"></a></li>
                <li><button>Sign In</button></li>
            </ul>
        </header>
        <div class="main">
            <img src="google_icon.png" class="google-image">
            <form action="https://google.com/search">
                <div class="searchBox">
                    <input type="text" name="q" class="search">
                    <div class="icons">
                        <div><img src="search_icon.png" id="search-icon" width="12px" height="12px"></div>
                        <div><img src="mic_icon.png" id="mic-icon" width="25px" height="25px"></div>
                    </div>
                </div>
                <div class="buttons">
                    <button>Google Search</button>
                    <button>I'm Feeling Lucky</button>
                </div>
            </form>
            <ul class="languages">
                <li>Google offered in:</li>
                <li><a href="#">简体中文</a></li>
                <li><a href="#">Bahasa Melayu</a></li>
                <li><a href="#">தமிழ்</a></li>
            </ul>
        </div>
        <div class="footer">
            <div class="row row1">
                <p class="country">Singapore</p>
            </div>
            <div class="row row2">
                <ul>
                    <li><a href="https://www.google.com/about">About</a></li>
                    <li><a href="https://www.google.com/intl/en_sg/ads">Advertising</a></li>
                    <li><a href="https://www.google.com/business">Business</a></li>
                    <li><a href="https://www.google.com/search/howsearchworks">How Search works</a></li>
                </ul>
                <ul>
                    <li><a href="#">Privacy</a></li>
                    <li><a href="#">Terms</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </div>
    </section>
</body>

</html>
